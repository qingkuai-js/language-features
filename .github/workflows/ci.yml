name: E2E

on:
    push:
        branches: [dev, main, "ci/**"]
    pull_request:
        branches: [dev, main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    vscode-extension:
        name: VS Code extension e2e (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os:
                    - macos-latest
                    - windows-latest
        steps:
            - uses: actions/checkout@v7

            # pnpm 版本由 package.json 的 packageManager 字段固定
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # grammar JSON 是生成物且被 gitignore，构建时才会拷贝过来
            - name: Build grammars
              working-directory: packages/vscode-extension
              run: pnpm run build:grammars

            - name: Build
              run: pnpm run build

            # ./config 入口必须能独立加载，不能引入语言服务的依赖
            - name: Verify config entry
              run: node scripts/verify-config-entry.mjs

            # @vscode/test-electron 把下载的 VS Code 放在这里；
            # 缓存 key 跟随 .vscode-test.mjs 中固定的版本
            - name: Cache VS Code
              uses: actions/cache@v6
              with:
                  path: packages/vscode-extension/.vscode-test
                  key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/vscode-extension/.vscode-test.mjs') }}

            # 已知缺陷用例带 @known-bug 标记，CI 只跑排除它们后的集合
            - name: Run e2e tests
              working-directory: packages/vscode-extension
              run: pnpm run test:e2e:clean
