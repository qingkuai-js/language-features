packages:
  - ./packages/*

catalog:
  "@modelcontextprotocol/sdk": ^1.30.0
  # 语言服务器、tsserver 插件与 MCP 服务器都复用宿主已有的 typescript，需要带 setTypeScript /
  # setTypeScriptPath 的版本（见 qingkuai 的 "feat(compiler): allow hosts to inject the typescript API"）
  # The language server, the tsserver plugin and the MCP server reuse the host's typescript, which needs
  # the release carrying setTypeScript / setTypeScriptPath.
  qingkuai: ^1.0.103
  prettier: ^3.5.3
  typescript: ^6.0.2
  vitest: ^2.1.9
  prettier-plugin-qingkuai: ^1.0.43
  vscode-languageserver: ^9.0.1
  vscode-languageserver-textdocument: ^1.0.12
  vscode-languageserver-types: ">=3.17.5 <3.18.0"
  vscode-uri: ^3.1.0
  tsx: ^4.21.0
  "@types/node": ^22.13.8
  "@types/vscode": ^1.93.0
  "@vscode/emmet-helper": ^2.11.0
